name: Bridge CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run C++ unit tests
        run: bash ops/test-unit.sh
      - name: Run deployment and mode manager tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml
          /usr/bin/python3 -m unittest discover -s ops/tests -v
      - name: Build ROS 2 bridge image
        run: docker build -t deos-ros-bridge:ci .
      - name: Validate deployment definition
        run: docker compose --env-file /dev/null -f deploy/compose.yaml config --quiet
